name: Playwright Tests

on:
  push:
    branches:
      - main

jobs:
  run-tests:
    # 🌟 FIX: லினக்ஸிற்கு பதிலாக விண்டோஸ் சர்வரைப் பயன்படுத்துகிறோம்
    runs-on: windows-latest
    env:
      TESTDINO_API_KEY: ${{ secrets.TESTDINO_API_KEY }}
      CI: true

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # 🌟 FIX: விண்டோஸில் 'xvfb-run' தேவையில்லை. சாதாரண கமாண்ட் மூலமாகவே பிரவுசர் இயங்கும்.
      - name: Run Playwright Tests
        run: npx playwright test --grep "@smoke|@regression"

      - name: Upload Playwright Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: test-results/ 
          retention-days: 30