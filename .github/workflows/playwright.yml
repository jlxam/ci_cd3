name: Playwright Tests

on:
  push:
    branches:
      - main

jobs:
  run-tests:
    runs-on: ubuntu-latest
    env:
      TESTDINO_API_KEY: ${{ secrets.TESTDINO_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run smoke tests
        run: xvfb-run -a npx playwright test --grep @smoke

      - name: Run regression tests
        run: xvfb-run -a npx playwright test --grep @regression

      - name: Upload trace artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/**/trace.zip

      # 🌟 FIX: ಇಂಡೆಂಟೇಶನ್ ಮತ್ತು ತಪ್ಪು ಸಾಲುಗಳನ್ನು ಇಲ್ಲಿ ಸರಿಪಡಿಸಲಾಗಿದೆ
      - name: Upload Playwright Artifacts
        if: failure() # ಟೆಸ್ಟ್ ಫೇಲ್ ಆದಾಗ ಮಾತ್ರ ವಿಡಿಯೋ ಮತ್ತು ಸ್ಕ್ರೀನ್‌ಶಾಟ್ ಅಪ್‌ಲೋಡ್ ಮಾಡುತ್ತದೆ
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: test-results/ 
          retention-days: 30