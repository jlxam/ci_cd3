name: Playwright Tests

on:
  push:
    branches:
      - main

jobs:
  run-tests:
    runs-on: ubuntu-latest
    env:
      TESTDINO_API_KEY: ${{ secrets.TESTDINO_API_KEY }}
      CI: true

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # 🌟 FIX 1: Smoke மற்றும் Regression இரண்டையும் ஒரே கமாண்டில் இயக்குகிறோம்
      # 🌟 FIX 2: '--headed' ஃபிளாக் மூலம் Headless False செய்யப்படுகிறது
      - name: Run Playwright Tests (Headed Mode)
        run: xvfb-run --server-args="-screen 0 1280x1024x24" npx playwright test --grep "@smoke|@regression" --headed

      - name: Upload Playwright Artifacts
        if: always() 
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: test-results/ 
          retention-days: 30